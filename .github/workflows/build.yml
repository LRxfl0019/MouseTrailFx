name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build
        shell: msys2 {0}
        run: |
          windres app.rc -O coff -o build_res.o
          mkdir -p dist
          g++ -std=c++20 -O2 -s -municode -mwindows -static src/main.cpp build_res.o \
              -o dist/MouseTrailFx.exe \
              -lgdi32 -luser32 -lwinmm -lshell32 -lole32 -luuid
          ls -l dist/MouseTrailFx.exe

      - uses: actions/upload-artifact@v4
        with:
          name: MouseTrailFx-windows-x64
          path: dist/MouseTrailFx.exe
          if-no-files-found: error

  # 鎵?tag 鏃惰嚜鍔ㄥ彂 Release锛岄檮甯︾紪璇戝ソ鐨?exe
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MouseTrailFx-windows-x64
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/MouseTrailFx.exe
          generate_release_notes: true
          body: |
            Windows 10 1809+ / Windows 11 (x64)，免安装单文件。

            ## 功能
            - 拖尾：彗尾（连续光带）/ 星尘（离散亮点）
            - 点击：涟漪 / 星火 / 两者
            - 托盘菜单、开机自启、配置热更新、截图时隐藏特效

            ## 安装
            1. 下载 `MouseTrailFx.exe`，无需安装、无需运行库
            2. 双击运行；托盘图标双击打开设置

            首次运行如提示「未知发布者」（程序未签名），点「更多信息 → 仍要运行」，或先执行：

            ```powershell
            Unblock-File .\MouseTrailFx.exe
            ```

            快捷键：`Ctrl+Alt+P` 面板 · `Ctrl+Alt+F` 开关 · `Ctrl+Alt+Q` 退出

