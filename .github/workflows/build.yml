name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build
        shell: msys2 {0}
        run: |
          windres app.rc -O coff -o build_res.o
          mkdir -p dist
          g++ -std=c++20 -O2 -s -municode -mwindows -static src/main.cpp build_res.o \
              -o dist/MouseTrailFx.exe \
              -lgdi32 -luser32 -lwinmm -lshell32 -lole32 -luuid
          ls -l dist/MouseTrailFx.exe

      - uses: actions/upload-artifact@v4
        with:
          name: MouseTrailFx-windows-x64
          path: dist/MouseTrailFx.exe
          if-no-files-found: error

  # 打 tag 时自动发 Release，附带编译好的 exe
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MouseTrailFx-windows-x64
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/MouseTrailFx.exe
          generate_release_notes: true
          body: |
            Windows 10 1809+ / Windows 11 (x64)，免安装单文件。

            首次运行如提示「未知发布者」（SmartScreen），点「更多信息 → 仍要运行」，或先执行：

            ```powershell
            Unblock-File .\MouseTrailFx.exe
            ```
